/* ==============================
   PRODUCT QUANTITY
   ============================== */

function changeProductQty(id,change){

const el=
document.getElementById(
"qty-"+id
);

if(!el)return;

let value=
parseInt(el.textContent)||1;

const product=
products.find(
p=>p.id===id
);

if(!product)return;

value+=change;

if(value<product.min){

value=product.min;

}

if(value>product.stock){

value=product.stock;

}

el.textContent=value;

}


/* ==============================
   CART
   ============================== */

function addToCart(id){

const product=
products.find(
p=>p.id===id
);

if(!product)return;

const qtyEl=
document.getElementById(
"qty-"+id
);

let qty=
parseInt(
qtyEl?.textContent
)||product.min;


if(product.stock<=0){

toast(
"Stok produk habis."
);

return;

}


let item=
cart.find(
item=>item.id===id
);


if(item){

item.qty+=qty;

if(item.qty>product.stock){

item.qty=product.stock;

}

}else{

cart.push({

id:id,

qty:qty

});

}


saveCart();

renderCart();

toast(
`${product.emoji} ${product.name} masuk keranjang`
);

}


function removeFromCart(id){

cart=
cart.filter(
item=>item.id!==id
);

saveCart();

renderCart();

}


function changeCartQty(id,change){

const item=
cart.find(
item=>item.id===id
);

const product=
products.find(
p=>p.id===id
);

if(!item || !product)return;

item.qty+=change;

if(item.qty<1){

item.qty=1;

}

if(item.qty>product.stock){

item.qty=product.stock;

}

saveCart();

renderCart();

}


function getCartTotal(){

return cart.reduce(
(total,item)=>{

const product=
products.find(
p=>p.id===item.id
);

if(!product)return total;

return total+
(product.price*item.qty);

},
0
);

}


function renderCart(){

const box=
document.getElementById(
"cartItems"
);

let totalQty=0;

cart.forEach(item=>{

totalQty+=item.qty;

});


document.getElementById(
"cartCount"
).textContent=
totalQty;


if(!cart.length){

box.innerHTML=`

<div class="empty">

Tambahkan produk terlebih dahulu.
</p>

</div>

`;

document.getElementById(
"cartTotal"
).textContent="Rp0";

return;

}


box.innerHTML=
cart.map(item=>{

const product=
products.find(
p=>p.id===item.id
);

if(!product)return "";


return `

<div class="cart-item">

<div class="cart-emoji">

${product.emoji}

</div>

<div>

<strong>
${escapeHTML(product.name)}
</strong>

<small>

${rupiah(product.price)}
/
${escapeHTML(product.unit)}

</small>

<div
style="
display:flex;
align-items:center;
gap:5px;
margin-top:5px
">

<button
class="btn btn-secondary btn-small"
onclick="changeCartQty(
${product.id},-1
)">

−

</button>

<strong>
${item.qty}
</strong>

<button
class="btn btn-secondary btn-small"
onclick="changeCartQty(
${product.id},1
)">

+

</button>

</div>

</div>

<div>

<strong>
${rupiah(
product.price*item.qty
)}
</strong>

<br>

<button
onclick="removeFromCart(
${product.id}

style="
border:0;
background:none;
color:#d33;
font-size:12px
">

Hapus

</button>

</div>

</div>

`;

}).join("");


document.getElementById(
"cartTotal"
).textContent=
rupiah(
getCartTotal()

}

/* ==============================
   SAVE PRODUCT
   ============================== */

async function saveProduct(){

const name=
document
.getElementById("pName")
.value
.trim();

const category=
document
.getElementById("pCategory")
.value;

const price=
Number(
document.getElementById("pPrice")
.value
);

const wholesale=
Number(
document.getElementById("pWholesale")
.value
);

const stock=
Number(
document.getElementById("pStock")
.value
);

const min=
Number(
document.getElementById("pMin")
.value
);

const unit=
document
.getElementById("pUnit")
.value;

const emoji=
document
.getElementById("pEmoji")
.value
.trim()
||
"🥬";

const badge=
document
.getElementById("pBadge")
.value
.trim();


if(
!name ||
!price ||
!stock
){

alert(
"Nama, harga dan stok wajib diisi."
);

return;

}


const productData={

name:name,

category:category,

price:price,

wholesale:
wholesale || price,

stock:stock,

min:min || 1,

unit:unit,

emoji:emoji,

badge:badge

};


/* ==============================
   EDIT
   ============================== */

if(editingId){

const product=
products.find(
p=>p.id===editingId
);

if(!product)return;


if(cloudMode){

const result=
await updateProductCloud(
editingId,
productData
);


if(!result.success){

toast(
"⚠️ Cloud gagal update. Data lokal diperbarui."
);

}else{

toast(
"☁️ Produk berhasil diperbarui di Cloud."
);

}

}


/* UPDATE LOCAL */

Object.assign(
product,
productData
);


}else{


/* ==============================
   TAMBAH
   ============================== */

if(cloudMode){

const result=
await insertProductCloud(
productData
);


if(result.success){

products.push({

id:result.data.id,

name:result.data.name,

category:result.data.category,

price:Number(
result.data.price
),

wholesale:Number(
result.data.wholesale
),

stock:Number(
result.data.stock
),

min:Number(
result.data.min
)||1,

unit:result.data.unit,

emoji:result.data.emoji,

badge:result.data.badge

});


toast(
"☁️ Produk berhasil ditambahkan ke Cloud."
);

}else{

products.push({

id:Date.now(),

...productData

});

toast(
"⚠️ Cloud gagal. Produk disimpan lokal."
);

}

}else{

products.push({

id:Date.now(),

...productData

});

toast(
"✅ Produk berhasil ditambahkan."
);

}

}


saveProducts();

renderCategories();

renderProducts();

renderAdmin();

updateStats();

closeProductModal();

}


/* ==============================
   DELETE PRODUCT
   ============================== */

async function deleteProduct(id){

const product=
products.find(
p=>p.id===id
);

if(!product)return;


if(!confirm(
`Hapus produk "${product.name}"?`
)){

return;

}


if(cloudMode){

const result=
await deleteProductCloud(id);


if(!result.success){

toast(
"❌ Gagal menghapus dari Cloud. Periksa policy Supabase."
);

return;

}

}


products=
products.filter(
p=>p.id!==id
);


cart=
cart.filter(
item=>item.id!==id
);


saveProducts();

saveCart();

renderCategories();

renderProducts();

renderCart();

renderAdmin();

updateStats();


toast(
cloudMode
?
"☁️ Produk dihapus dari Cloud."
:
"🗑️ Produk dihapus."
);

}

/* ==============================
   SECURITY / ESCAPE
   ============================== */

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


function escapeAttr(value){

return String(value)

.replace(
/'/g,
"\\'"
)

.replace(
/"/g,
"&quot;"
);

}
